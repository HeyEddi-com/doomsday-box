upstream doombox_api {
    server api:8090;
}

upstream doombox_dashboard {
    server dashboard:80;
}

server {
    listen 80 default_server;
    server_name box.local doomsday.local box.heyeddi.local doomsday.heyeddi.local _;

    # Keep redirects on the browser origin (compose may publish 8080→80).
    absolute_redirect off;
    client_max_body_size 32m;

    # Session check for auth_request (browser remote desktop) — internal only
    location = /internal/auth-session {
        internal;
        proxy_pass http://doombox_api/api/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Doombox-Host $host;
    }

    location /api/ {
        proxy_pass http://doombox_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Doombox-Host $host;
    }

    # Authenticated browser desktop (webtop / KasmVNC). Upstream may be absent until profile is up.
    location /desktop/ {
        auth_request /internal/auth-session;
        error_page 401 = @desktop_unauth;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desktop_upstream remote-desktop:3000;
        proxy_pass http://$desktop_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location @desktop_unauth {
        # Hub first: claim/login, then come back to the desktop.
        return 302 /login?next=/desktop/;
    }

    location / {
        proxy_pass http://doombox_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Doombox-Host $host;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
