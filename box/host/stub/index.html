<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeyEddi Doomsday Box</title>
  <style>
    :root {
      --bg: #12141a;
      --fg: #e8e6e1;
      --muted: #9a968c;
      --accent: #c4a574;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #1e2430 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #1a2220 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      padding: 2rem;
    }
    main { max-width: 36rem; text-align: left; }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); line-height: 1.55; margin: 0.75rem 0 0; }
    .brand { color: var(--accent); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <p class="brand">HeyEddi Doomsday Box</p>
    <h1>Host is up. Setup is next.</h1>
    <p>
      This appliance reached the v0 host milestone: Debian, Docker, and local names
      <strong>box.local</strong> / <strong>doomsday.local</strong>.
      The browser setup wizard will replace this page.
    </p>
    <p>No cloud login required. Zero telemetry by default.</p>
  </main>
</body>
</html>
