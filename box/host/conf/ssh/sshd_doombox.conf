# DoomBox SSH policy
# Remote shell is OFF by default (sshd disabled). When enabled via
# doombox-enable-operator --enable-ssh, only pubkey auth for heyeddi.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

AllowUsers heyeddi
DenyUsers doombox

# Reduce auth noise / brute force usefulness (sshd should be off anyway for most boxes)
MaxAuthTries 3
LoginGraceTime 20
