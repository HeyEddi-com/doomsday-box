server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name box.local doomsday.local _;

    root /var/www/doombox-stub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tiny footprint; stub only until the dashboard owns :80 / a reverse proxy.
    access_log /var/log/nginx/doombox-stub.access.log;
    error_log  /var/log/nginx/doombox-stub.error.log;
}
