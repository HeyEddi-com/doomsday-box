name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: box/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  host-smoke:
    name: Host container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Debian bootstrap smoke
        run: bash box/host/test/run-container-smoke.sh

  compose-smoke:
    name: Compose stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run api + dashboard + gateway smoke
        run: bash box/test/run-compose-smoke.sh
